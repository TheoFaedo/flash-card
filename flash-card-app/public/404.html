<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirection…</title>
    <script>
      const base = '/flash-card/';
      const path = window.location.pathname.startsWith(base)
        ? window.location.pathname.slice(base.length - 1)
        : '/';
      const target = new URL(base, window.location.origin);
      target.searchParams.set('p', path);
      if (window.location.search) target.searchParams.set('q', window.location.search.slice(1));
      if (window.location.hash) target.searchParams.set('h', window.location.hash.slice(1));
      window.location.replace(target);
    </script>
  </head>
  <body></body>
</html>
