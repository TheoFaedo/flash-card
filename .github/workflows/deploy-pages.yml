name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        working-directory: flash-card-app
        run: bun install --frozen-lockfile
      - name: Create Supabase environment file
        working-directory: flash-card-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node -e '
            const { writeFileSync } = require("node:fs");
            const { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } = process.env;
            if (!SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY) {
              throw new Error("SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secrets are required");
            }
            const contents = `export const environment = ${JSON.stringify({
              supabaseUrl: SUPABASE_URL,
              supabasePublishableKey: SUPABASE_PUBLISHABLE_KEY,
            }, null, 2)};\n`;
            writeFileSync("src/environments/environment.ts", contents);
          '
      - name: Build Angular app
        working-directory: flash-card-app
        run: bun run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flash-card-app/dist/flash-card-app/browser

  deploy:
    environment:
      name: prod
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
